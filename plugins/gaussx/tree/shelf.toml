# gaussx's shelf: its listed skills, its units and its 24 entries.
#
# Every name in gaussx.__all__ belongs to exactly one entry (gate SH-1), and the
# entry's file names it. scripts/skill_shelf.py writes the generated parts of the
# three SKILL.md files from this file and checks the gates.

# Where the public names are read from: module = its file, from the root.
[modules]
gaussx = "src/gaussx/__init__.py"

[skills.structured-gaussian-linalg]
builds_on_units = []

[skills.solvers-and-preconditioners]
builds_on_units = ["structures-and-primitives"]

[skills.gaussians-and-recipes]
builds_on_units = ["structures-and-primitives", "strategies"]

[units.structures-and-primitives]
title = "Structures and primitives"
rungs = "⓪ ①"
skill = "structured-gaussian-linalg"

[units.strategies]
title = "Strategies"
rungs = "②, setup"
skill = "solvers-and-preconditioners"

[units.gaussians]
title = "Gaussians"
rungs = "③"
skill = "gaussians-and-recipes"

[units.gaussian-processes]
title = "Gaussian processes"
rungs = "④"
skill = "gaussians-and-recipes"

[units.state-space]
title = "State space"
rungs = "③ ④"
skill = "gaussians-and-recipes"

[units.quadrature]
title = "Quadrature"
rungs = "② to ④"
skill = "gaussians-and-recipes"

[units.inference-and-ensembles]
title = "Inference and ensembles"
rungs = "④"
skill = "gaussians-and-recipes"

