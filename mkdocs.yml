# ---------------------------------------------------------------------------
# Zensical builds ONLY the API reference from this file (it reads mkdocs.yml
# as is), and it is deployed as the `/reference/` subtree of the MyST site.
# The home page, guides, design pages and notebooks are built by mystmd from
# `docs/myst.yml`. See `docs/README.md` for the split and the rationale.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: gaussx API reference
site_description: API reference for gaussx, structured linear algebra, Gaussian distributions, and exponential family primitives for JAX, generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/gaussx
repo_name: jejjohnson/gaussx

docs_dir: docs/api
site_dir: site

# Any warning (a broken cross-reference, an unresolvable `::: gaussx.X`)
# fails the build.
strict: true

# The guide pages live in the MyST half of the site, so links to them point
# outside `docs_dir` by design. The assembled-site link checker in
# `scripts/build_docs.py` validates them instead, across both halves, which
# neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  # Zensical's Material-compatible look; `modern` is its newer default.
  variant: classic
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]

nav:
  - Overview: index.md
  - Primitives: primitives.md
  - Operators & Tags: operators.md
  - Sparse Operators: sparse.md
  - GMRF Precision Builders: gmrf.md
  - Solvers & Preconditioners: solvers.md
  - Linear-Algebra Utilities: linalg.md
  - Sketching: sketching.md
  - Randomized Linear Algebra: randomized.md
  - Distributions & Exponential Family: distributions.md
  - Gaussian Processes: gp.md
  - Quadrature & Moment Matching: quadrature.md
  - State-Space Models & Kalman: ssm.md
  - Bayesian Inference & Ensembles: inference.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
