name: Report scheduled failure
description: >-
  Open a tracking issue for a failed scheduled workflow, or comment on the
  one already open, so a red cron run is not silently ignored. The calling
  job needs `issues: write`.

inputs:
  title:
    description: Title of the tracking issue; one open issue is kept per title.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: ${{ inputs.title }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh label create ci-failure --color B60205 \
          --description "A scheduled CI run failed" 2>/dev/null || true
        num=$(gh issue list --state open --label ci-failure --limit 100 \
          --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')
        body="Scheduled run failed on \`${GITHUB_SHA::7}\`: $RUN_URL"
        if [ -n "$num" ]; then
          gh issue comment "$num" --body "$body"
        else
          gh issue create --title "$TITLE" --label ci-failure --body "$body"
        fi
