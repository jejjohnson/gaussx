version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # "uv" reads and updates uv.lock; "pip" cannot, so it never opened a
  # useful Python PR here.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    groups:
      # The JAX stack usually has to move together.
      jax-stack:
        patterns:
          - "jax"
          - "jaxlib"
          - "equinox"
          - "lineax"
          - "matfree"
          - "jaxtyping"
          - "einx"
          - "numpyro"
      dev-tools:
        dependency-type: "development"
