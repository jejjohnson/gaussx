name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # List the slowest tests in every log, so a test that outgrows the fast
  # lane (unmarked tests stay under ~1 s; see AGENTS.md) is visible in review.
  PYTEST_ADDOPTS: --durations=15

jobs:
  # Every PR: every supported Python version (the classifiers in
  # pyproject.toml), fast unit tests only, with coverage so
  # `fail_under` in pyproject.toml gates the PR rather than main after merge.
  # Slow numerics and end-to-end integration tests run on demand via the
  # "Extended Tests" workflow (workflow_dispatch).
  test-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run fast tests with coverage
        run: uv run pytest -n auto -m "not slow and not integration" --cov=src/gaussx --cov-report=term-missing:skip-covered

  # Every PR: the float32 lane. The suite otherwise runs with x64 on, so
  # JAX's default configuration (float32, no float64) is never exercised.
  # `make test-no-x64` runs the curated subset in NO_X64_TESTS with
  # GAUSSX_TEST_X64=0; tests marked x64_only (with a reason) are skipped.
  test-no-x64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same persistent JAX compilation cache as test-fast (float32 programs
      # are cached under their own keys, so the lanes do not collide).
      - name: Restore the JAX compilation cache
        uses: actions/cache@v6
        with:
          path: .pytest_cache/jax
          key: jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-no-x64
          restore-keys: |
            jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            jax-cache-${{ runner.os }}-
      # Persistent JAX compilation cache (tests/conftest.py writes it here).
      # Compiled XLA programs do not depend on the Python version, so all
      # jobs share one cache: restore the newest for this lockfile, else any;
      # every job saves its own (run- and job-scoped key).
      - name: Restore the JAX compilation cache
        uses: actions/cache@v6
        with:
          path: .pytest_cache/jax
          key: jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: |
            jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            jax-cache-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run fast tests with x64 off
        run: make test-no-x64

  # Every PR and push: strict docs build (`strict: true` in mkdocs.yml), so a
  # broken cross-reference or an unresolvable `::: gaussx.X` fails here, not
  # on the deployed site. Notebooks are pre-executed, so no kernel is needed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install docs dependencies
        run: uv sync --locked --group docs
      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  # Every PR and push: build the wheel and sdist and check what they ship.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build wheel and sdist
        run: uv build
      - name: Check artifact contents
        run: |
          unzip -l dist/*.whl | grep -q 'gaussx/py.typed' \
            || { echo "::error::the wheel has no gaussx/py.typed (PEP 561)"; exit 1; }
          size=$(stat -c %s dist/*.tar.gz)
          [ "$size" -lt 1000000 ] \
            || { echo "::error::the sdist is $size bytes, over the 1 MB budget"; exit 1; }
          if tar tzf dist/*.tar.gz \
              | grep -E '\.ipynb$|/\.github/|/\.claude/|/uv\.lock$|/CLAUDE\.md$|/AGENTS\.md$|/\.env\.example$'; then
            echo "::error::the sdist ships the files listed above; see [tool.hatch.build.targets.sdist]"
            exit 1
          fi
      - name: Install the sdist and import it
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import gaussx; print(gaussx.__version__)"

  # Pushes to main: fast tests across the version matrix, with coverage.
  test-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # Persistent JAX compilation cache (tests/conftest.py writes it here).
      # Compiled XLA programs do not depend on the Python version, so all
      # jobs share one cache: restore the newest for this lockfile, else any;
      # every job saves its own (run- and job-scoped key).
      - name: Restore the JAX compilation cache
        uses: actions/cache@v6
        with:
          path: .pytest_cache/jax
          key: jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: |
            jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            jax-cache-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run fast tests with coverage
        run: uv run pytest -n auto -m "not slow and not integration" --cov=src/gaussx --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
