name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every PR: every supported Python version (the classifiers in
  # pyproject.toml), fast unit tests only, with coverage so
  # `fail_under` in pyproject.toml gates the PR rather than main after merge.
  # Slow numerics and end-to-end integration tests run on demand via the
  # "Extended Tests" workflow (workflow_dispatch).
  test-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run fast tests with coverage
        run: uv run pytest -n auto -m "not slow and not integration" --cov=src/gaussx --cov-report=term-missing:skip-covered

  # Pushes to main: fast tests across the version matrix, with coverage.
  test-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run fast tests with coverage
        run: uv run pytest -n auto -m "not slow and not integration" --cov=src/gaussx --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
