name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install typecheck dependencies
        run: uv sync --locked --group typecheck
      - name: Run ty check
        # [tool.ty.environment] pins 3.12 as the local default; CI checks each
        # supported version explicitly.
        run: uv run --group typecheck ty check --python-version ${{ matrix.python-version }} src/gaussx
