name: Extended Tests

# The slow + integration tests the PR fast lane skips. Runs:
#   - weekly (Monday 04:17 UTC), full suite; a failure opens a `ci-failure` issue.
#   - on a PR labelled `run-slow`, heavy lane (slow + integration only),
#     re-running on every push while the label is on.
#   - on demand, from the Actions tab or:
#       gh workflow run tests-extended.yml                 # heavy lane (slow + integration)
#       gh workflow run tests-extended.yml -f suite=full   # entire suite
#       gh workflow run tests-extended.yml --ref my-branch -f suite=full

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests to run"
        type: choice
        default: heavy
        options:
          - heavy   # only slow + integration tests
          - full    # entire suite
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# A new push supersedes a running PR run. Concurrency applies before the job
# `if:`, so adding any other label would cancel a real run for one that then
# skips; those events get a group of their own.
concurrency:
  group: >-
    tests-extended-${{ github.ref }}${{
    (github.event.action == 'labeled' && github.event.label.name != 'run-slow')
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-extended:
    # On PRs, only with the `run-slow` label; for a `labeled` event, only
    # when that label is the one just added.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-slow') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-slow'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Dispatch picks the suite; scheduled runs take the full suite and
      # labelled PRs the heavy lane.
      SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'full') || 'heavy' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run heavy lane (slow + integration)
        if: env.SUITE == 'heavy'
        run: uv run pytest -v -n auto -m "slow or integration"
      - name: Run full suite
        if: env.SUITE == 'full'
        run: uv run pytest -v -n auto

  report:
    needs: test-extended
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/report-scheduled-failure
        with:
          title: "ci: the weekly extended-tests run failed"
