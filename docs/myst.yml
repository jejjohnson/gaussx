        - title: Distributions and inference
          children:
            - file: notebooks/exponential_family.ipynb
              title: Exponential family
            - file: notebooks/conditional_distributions.ipynb
              title: Conditional distributions
            - file: notebooks/bayesian_updates.ipynb
              title: Bayesian updates
            - file: notebooks/uncertainty_propagation.ipynb
              title: Uncertainty propagation
            - file: notebooks/expectation_propagation.ipynb
