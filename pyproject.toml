[project]
name = "gaussx"
version = "0.8.4"
description = "Structured linear algebra, Gaussian distributions, and exponential family primitives for JAX."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["jax", "linear-algebra", "gaussian", "equinox", "lineax"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "jax>=0.10",
    "jaxlib>=0.10",
    "equinox>=0.13.8",
    "lineax>=0.1.1",
    "matfree>=0.6.2",
    "jaxtyping>=0.3",
    "einx>=0.4.3",
    "optimistix>=0.1.0",
]

[project.urls]
Repository = "https://github.com/jejjohnson/gaussx"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pre-commit>=3.7",
    "beartype>=0.18",
    "jupytext>=1.19.1",
    # Test-only: the constants tests compare gaussx's defaults with geophysix's.
    # gaussx sits below geophysix and never imports it at run time.
    "geophysix",
]
lint = [
    "ruff>=0.16.10",
]
typecheck = [
    "ty>=0.0.34",
]
docs = [
    "matplotlib>=3.8",
    # The prose half of the site (guides, design pages and the executed
    # notebooks) is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. Zensical (the successor to
    # Material for MkDocs, which reached end of life on 2026-11-05) builds only
    # the API reference from mkdocs.yml; its `objects.inv` is what lets the MyST
    # prose cross-reference into it. See docs/README.md.
    "zensical>=0.0.74",
    "mkdocstrings[python]>=1.0.8",
    # scripts/build_docs.py, which builds both halves and checks their links.
    "cyclopts>=4",
    "loguru>=0.7",
    "jupytext>=1.19.1",
    "ipykernel>=6.29",
]

[tool.uv.sources]
geophysix = { git = "https://github.com/jejjohnson/geophysix.git", tag = "v0.0.3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaussx"]

[tool.hatch.build.targets.sdist]
# Allow-list: only what building and testing gaussx needs, so notebooks,
# uv.lock and tooling/agent files stay out without an exclude entry each.
include = [
    "/src/gaussx",
    "/tests",
    "/docs/api",  # read by tests/test_docs_api_coverage.py
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
allowed-confusables = ["−", "σ", "𝒩", "×", "μ", "Σ", "α", "β", "λ", "ε", "∈", "⊙", "≈", "⟺", "∣", "ℝ", "ℓ", "𝔼", "𝕍", "ν", "γ", "ρ", "ℛ", "′", "″", "ℒ", "ℐ", "ℍ", "ℰ", "𝒥"]

# The einx convention (AGENTS.md, gh-404): contractions, permutations and
# reshapes go through gaussx._einx, so the jnp spellings are banned outright.
[tool.ruff.lint.per-file-ignores]
# Each maths expression in a notebook stays on one source line.
"docs/notebooks/*.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"jax.numpy.einsum".msg = "use gaussx._einx.einsum"
"jax.numpy.transpose".msg = "use gaussx._einx.rearrange (or .T on a lineax operator)"
"jax.numpy.moveaxis".msg = "use gaussx._einx.rearrange"
"jax.numpy.reshape".msg = "use gaussx._einx.rearrange"

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hard per-test ceiling so a hang (e.g. an iterative solver that never
# converges) fails in minutes, not at the runner's 6-hour limit. This is not
# the tiering line (unmarked tests stay under ~1 s, see AGENTS.md); it leaves
# room for cold-cache compiles of the slow lane on a loaded runner. Raise it
# for one test with @pytest.mark.timeout(...).
timeout = 120
markers = [
    "slow: individually expensive tests (>~1.5s: heavy numerics, jit+grad+vmap sweeps)",
    "integration: end-to-end workflows and optional external backends",
    "x64_only: needs float64 (tight tolerances or float64 references); skipped in the no-x64 lane, with a reason in the marker",
]

[tool.coverage.run]
source = ["src/gaussx"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Ratchet: a little below the fast lane's measured total (97.1% at 0.4.0),
# so a real drop fails the PR. Raise it as coverage rises; never lower it
# to make a PR pass.
fail_under = 95
