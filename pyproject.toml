[project]
name = "gaussx"
version = "0.6.5"
description = "Structured linear algebra, Gaussian distributions, and exponential family primitives for JAX."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["jax", "linear-algebra", "gaussian", "equinox", "lineax"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "jax>=0.10",
    "jaxlib>=0.10",
    "equinox>=0.13.8",
    "lineax>=0.1.1",
    "matfree>=0.6.2",
    "jaxtyping>=0.3",
    "einx>=0.4.3",
    "optimistix>=0.1.0",
]

[project.urls]
Repository = "https://github.com/jejjohnson/gaussx"

[project.optional-dependencies]
numpyro = [
    "numpyro>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pre-commit>=3.7",
    "beartype>=0.18",
    "numpyro>=0.21",
    "jupytext>=1.19.1",
]
lint = [
    "ruff>=0.16.10",
]
typecheck = [
    "ty>=0.0.34",
    "numpyro>=0.21",
]
docs = [
    "matplotlib>=3.8",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
    "jupytext>=1.19.1",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaussx"]

[tool.hatch.build.targets.sdist]
# Allow-list: only what building and testing gaussx needs, so notebooks,
# uv.lock and tooling/agent files stay out without an exclude entry each.
include = [
    "/src/gaussx",
    "/tests",
    "/docs/api",  # read by tests/test_docs_api_coverage.py
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
allowed-confusables = ["−", "σ", "𝒩", "×", "μ", "Σ", "α", "β", "λ", "ε", "∈", "⊙", "≈", "⟺"]

# The einx convention (CLAUDE.md, gh-404): contractions, permutations and
# reshapes go through gaussx._einx, so the jnp spellings are banned outright.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"jax.numpy.einsum".msg = "use gaussx._einx.einsum"
"jax.numpy.transpose".msg = "use gaussx._einx.rearrange (or .T on a lineax operator)"
"jax.numpy.moveaxis".msg = "use gaussx._einx.rearrange"
"jax.numpy.reshape".msg = "use gaussx._einx.rearrange"

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hard per-test ceiling so a hang (e.g. an iterative solver that never
# converges) fails in minutes, not at the runner's 6-hour limit. This is not
# the tiering line (unmarked tests stay under ~1 s, see CLAUDE.md); it leaves
# room for cold-cache compiles of the slow lane on a loaded runner. Raise it
# for one test with @pytest.mark.timeout(...).
timeout = 120
markers = [
    "slow: individually expensive tests (>~1.5s: heavy numerics, jit+grad+vmap sweeps)",
    "integration: end-to-end workflows (MCMC/SVI fits through numpyro)",
    "x64_only: needs float64 (tight tolerances or float64 references); skipped in the no-x64 lane, with a reason in the marker",
]

[tool.coverage.run]
source = ["src/gaussx"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Ratchet: a little below the fast lane's measured total (97.1% at 0.4.0),
# so a real drop fails the PR. Raise it as coverage rises; never lower it
# to make a PR pass.
fail_under = 95
